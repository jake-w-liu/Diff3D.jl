name: CI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  package-tests:
    name: Package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - name: Instantiate package environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run package tests
        run: |
          set -euo pipefail
          julia --project=. -O0 --compile=min -e 'using Pkg; Pkg.test()' &
          test_pid=$!
          (
            while kill -0 "$test_pid" 2>/dev/null; do
              sleep 60
              kill -0 "$test_pid" 2>/dev/null || break
              printf 'DIFF3D_TEST_HEARTBEAT %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            done
          ) &
          heartbeat_pid=$!
          set +e
          wait "$test_pid"
          status=$?
          set -e
          kill "$heartbeat_pid" 2>/dev/null || true
          wait "$heartbeat_pid" 2>/dev/null || true
          exit "$status"

  examples-browser:
    name: Registered examples browser smoke
    runs-on: ubuntu-latest
    # CI renders WebGL in software (swiftshader), ~50-100x slower than a GPU.
    # Shard the 108 examples across parallel runners so wall-clock is ~30 min
    # instead of ~3 h. fail-fast: false so one shard's failure still lets the
    # others report.
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/6", "2/6", "3/6", "4/6", "5/6", "6/6"]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instantiate package environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          sudo grep -rl "packages.microsoft.com" /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f
          python -m playwright install --with-deps chromium
      - name: Verify registered examples
        run: python examples/verify_examples_registry.py --shard ${{ matrix.shard }}
