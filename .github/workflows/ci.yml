name: CI

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      full_platform:
        description: Run the complete release platform and browser matrix
        type: boolean
        default: false
  workflow_call:
    inputs:
      full_platform:
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package-tests:
    name: Optimized tests (${{ matrix.os }}, Julia ${{ matrix.julia }}, shard ${{ matrix.shard }}/6)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.full_platform && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
        julia: ["1.10", "1"]
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - name: Instantiate package environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Verify test runner
        run: julia --project=. --depwarn=error test/test_runner.jl
      - name: Run complete optimized package test shard
        run: julia --project=. -e 'using Pkg; Pkg.test(test_args=ARGS)' -- --shard=${{ matrix.shard }}/6 --require-optimized --report=${{ github.workspace }}/test-results/shard.toml
      - name: Verify concurrent rendering
        if: matrix.shard == 1
        run: julia --project=. --threads=4 -e 'include("test/tiled_cache_ownership.jl"); include("test/render_cache_lifetimes.jl")'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}-${{ matrix.julia }}-${{ matrix.shard }}
          path: test-results/*.toml
          if-no-files-found: error

  native-coverage:
    name: Complete optimized test coverage
    needs: package-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify coverage validator
        run: python test/test_check_shards.py
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: test-results
      - name: Require every optimized shard on this revision
        run: python test/check_shards.py test-results --groups=${{ inputs.full_platform && 6 || 2 }} --revision=${{ github.sha }}

  examples-browser:
    name: Browser validation (${{ matrix.browser }}, examples ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
    # Split example generation and browser checks across six runners.
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ inputs.full_platform && fromJSON('["chromium", "firefox", "webkit"]') || fromJSON('["chromium"]') }}
        shard: ["1/6", "2/6", "3/6", "4/6", "5/6", "6/6"]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instantiate package environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r test/requirements-browser.txt
          sudo grep -rl "packages.microsoft.com" /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Verify browser rendering pixels
        if: matrix.shard == '1/6'
        run: python test/browser_rendering.py --browser ${{ matrix.browser }}
      - name: Verify registered examples
        run: python examples/verify_examples_registry.py --browser ${{ matrix.browser }} --shard ${{ matrix.shard }}
