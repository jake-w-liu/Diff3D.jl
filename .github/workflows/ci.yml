name: CI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  package-tests:
    name: Package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - name: Instantiate package environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run package tests
        run: julia --project=. -O0 --compile=min -e 'using Pkg; Pkg.test()'

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - name: Instantiate docs environment
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build docs
        env:
          CI: "false"
        run: julia --project=docs docs/make.jl

  examples-browser:
    name: Registered examples browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instantiate package environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify registered examples
        run: python examples/verify_examples_registry.py
