name: CI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  package-tests:
    name: Package tests (Julia ${{ matrix.julia }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        julia: ["1.10", "1"]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - name: Instantiate package environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run package tests
        run: julia --project=. -O0 --compile=min -e 'using Pkg; Pkg.test()'
      - name: Verify optimized allocation regressions
        run: julia --project=. -e 'include("test/light_direction_scale.jl"); include("test/scaled_direction_gradients.jl"); include("test/line_projection_gradients.jl"); include("test/camera_pose_allocations.jl"); include("test/soft_mixed_allocations.jl"); include("test/render_cache_lifetimes.jl"); include("test/soft_workspace_lifetimes.jl"); include("test/numerical_gradient_range.jl"); include("test/scene_collection_allocations.jl"); include("test/lod_manual_allocations.jl"); include("test/instanced_render_allocations.jl"); include("test/primitive_appearance.jl")'
      - name: Verify concurrent rendering
        run: julia --project=. --threads=4 -O0 --compile=min -e 'include("test/tiled_cache_ownership.jl"); include("test/render_cache_lifetimes.jl")'

  examples-browser:
    name: Registered examples browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
    # Split example generation and browser checks across six runners.
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/6", "2/6", "3/6", "4/6", "5/6", "6/6"]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instantiate package environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          sudo grep -rl "packages.microsoft.com" /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f
          python -m playwright install --with-deps chromium
      - name: Verify browser rendering pixels
        if: matrix.shard == '1/6'
        run: python test/browser_rendering.py
      - name: Verify registered examples
        run: python examples/verify_examples_registry.py --shard ${{ matrix.shard }}
