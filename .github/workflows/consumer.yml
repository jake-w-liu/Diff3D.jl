name: Consumer acceptance

"on":
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  install:
    name: Installed consumer (${{ matrix.os }}, Julia ${{ matrix.julia }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        julia: ["1.10", "1.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - name: Install committed package and exercise public workflows
        run: julia --startup-file=no release/1.0/consumer_install.jl consumer-results ${{ github.sha }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: consumer-${{ matrix.os }}-${{ matrix.julia }}
          path: consumer-results/
          if-no-files-found: error

  browser:
    name: Installed export (${{ matrix.browser }})
    needs: install
    # Firefox is validated on macOS for the reason recorded in ci.yml.
    runs-on: ${{ matrix.browser == 'firefox' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          name: consumer-ubuntu-latest-1.13
          path: consumer-results
      - name: Install browser
        run: |
          python -m pip install -r test/requirements-browser.txt
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m playwright install --with-deps ${{ matrix.browser }}
          else
            python -m playwright install ${{ matrix.browser }}
          fi
      - name: Check standalone imported asset pixels
        run: python release/1.0/consumer_browser.py consumer-results/triangle.html --browser ${{ matrix.browser }}
