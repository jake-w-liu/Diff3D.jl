name: Diagnose Firefox blank frame

# Temporary: lives only on diag/** branches and is deleted with them.
# Round 4: is it the first launch on a freshly started X server?
# Round 3: why does a Firefox launch under Xvfb sometimes get no WebGL context?
# Round 2: the macOS runner gives Firefox Apple's software OpenGL renderer, which drops
# clipped triangles. This measures whether Linux Firefox (Mesa under Xvfb) gets a WebGL
# context reliably and rasterises the same triangles correctly.
"on":
  push:
    branches:
      - "diag/**"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  linux-firefox:
    name: Linux Firefox (${{ matrix.screen }}, ${{ matrix.rep }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
    strategy:
      fail-fast: false
      matrix:
        screen: ["default"]
        rep: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Instantiate package environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Install Playwright
        run: |
          sudo grep -rl "packages.microsoft.com" /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f
          python -m pip install --upgrade pip
          python -m pip install -r test/requirements-browser.txt
          python -m playwright install --with-deps firefox
          sudo apt-get install -y --no-install-recommends xvfb
      - name: Choose the X server screen
        if: matrix.screen != 'default'
        run: echo "XVFB_SCREEN=${{ matrix.screen }}" >> "$GITHUB_ENV"
      - name: First launch on a fresh X server, no wait
        run: |
          for i in $(seq 1 30); do
            xvfb-run --auto-servernum python .github/diag/launch_probe.py 1 headless 2>&1 | grep -E 'LAUNCH_FAIL|LAUNCH_TALLY' | sed "s/^/FRESH_NOWAIT $i /"
          done
      - name: First launch on a fresh X server, after 3 s
        run: |
          for i in $(seq 1 30); do
            xvfb-run --auto-servernum bash -c 'sleep 3; python .github/diag/launch_probe.py 1 headless' 2>&1 | grep -E 'LAUNCH_FAIL|LAUNCH_TALLY' | sed "s/^/FRESH_WAIT $i /"
          done
