schema_version = 1

[[examples]]
upstream_id = "threejs_webgl_geometries"
upstream_url = "https://threejs.org/examples/#webgl_geometries"
local_script = "examples/live_webgl_showcase.jl"
status = "partial"
prerequisites = ["primitive geometry generators", "mesh materials", "orbit interaction", "browser smoke"]
known_deviations = [
  "Generated by Diff3D.jl's compact WebGL exporter rather than three.js WebGLRenderer",
  "Uses representative geometry/material coverage rather than the exact upstream scene layout"
]
verification = ["julia --project=. examples/live_webgl_showcase.jl", "python examples/browser_webgl_smoke.py examples/output/live_webgl_showcase.html"]

